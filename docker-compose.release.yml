name: Data_Quality_Services_HS_Aalen

services:
  backend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ghcr.io/ptsialis/data-quality-services-backend:latest
    environment:
      FLASK_ENV: "production"
      SECRET_KEY: "${SECRET_KEY:?Add SECRET_KEY to the project .env file}"
      CORS_ORIGINS: "http://localhost:8503"
      SESSION_COOKIE_SECURE: "false"
      SESSION_FILE_DIR: "/tmp/flask_sessions"
      SESSION_DATA_PATH: "/tmp/session_data"
      LOG_LEVEL: "INFO"
      HF_HOME: "/models/huggingface"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ghcr.io/ptsialis/data-quality-services-frontend:latest
    ports:
      - "8503:5173"
    environment:
      DOCKER: "true"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
